{% extends "base.html" %}
{% block title %}Add Nurse — MediCare System{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Add New Nurse</h1>
    <p>Create a new nurse account in the system.</p>
  </div>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('admin_add_nurse') }}" class="vertical-form">
    
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input 
        type="text" 
        id="full_name" 
        name="full_name" 
        placeholder="e.g., Sarah Johnson"
        required 
      />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="e.g., nurse@hospital.com"
        required 
      />
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        placeholder="e.g., nurse_sarah"
        autocomplete="username"
        required 
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Create a strong password"
        autocomplete="new-password"
        required 
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone (Optional)</label>
      <input 
        type="tel" 
        id="phone" 
        name="phone" 
        placeholder="e.g., 9876543210"
      />
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button type="submit" class="btn btn-primary">Create Nurse Account</button>
      <a href="{{ url_for('admin_nurses') }}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
